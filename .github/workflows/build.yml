name: Build StromX APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Native Android Gradle APK (if root build.gradle exists)
        if: hashFiles('gradlew') != ''
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Set up Flutter (if pubspec.yaml exists)
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter APK (if pubspec.yaml exists)
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: StromX-Access125-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            build/app/outputs/flutter-apk/*.apk
