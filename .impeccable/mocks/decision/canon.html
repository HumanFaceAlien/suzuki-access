<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f6f7f9;color:#111827;font-family:Roboto,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:50px 20px 10px}
.top h1{font:700 24px Roboto}
.chip{background:#e8f0fe;color:#2563eb;font:500 13px Roboto;padding:6px 12px;border-radius:16px}
.card{background:#fff;border-radius:20px;margin:10px 16px;padding:18px}
.ring{display:flex;justify-content:center;position:relative;height:250px}
.ring .t{position:absolute;top:78px;text-align:center}
.ring .t b{font:700 72px/1 Roboto;display:block}
.ring .t span{font:500 16px Roboto;color:#6b7280}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.row .card{margin:0}
.lab{font:500 13px Roboto;color:#6b7280}
.val{font:700 30px Roboto;margin-top:4px}
.val small{font:500 15px Roboto;color:#6b7280}
.bar{height:8px;background:#e5e7eb;border-radius:4px;margin-top:10px}
.bar i{display:block;height:8px;width:83%;background:#2563eb;border-radius:4px}
.btn{margin:12px 16px;background:#2563eb;color:#fff;border-radius:14px;height:56px;display:flex;align-items:center;justify-content:center;font:500 17px Roboto}
nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fff;display:flex;justify-content:space-around;align-items:center;font:500 12px Roboto;color:#6b7280}
nav b{color:#2563eb}
</style></head><body>
<div class="top"><h1>SXV</h1><span class="chip">Connected</span></div>
<div class="card"><div class="ring">
  <svg width="250" height="250" viewBox="0 0 250 250"><path d="M45 190 A100 100 0 1 1 205 190" fill="none" stroke="#e5e7eb" stroke-width="18" stroke-linecap="round"/><path d="M45 190 A100 100 0 0 1 120 25" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/></svg>
  <div class="t"><b>42</b><span>km/h</span></div>
</div></div>
<div class="row">
  <div class="card"><div class="lab">Engine</div><div class="val">82<small> °C</small></div><div class="bar"><i style="width:68%"></i></div></div>
  <div class="card"><div class="lab">Fuel</div><div class="val">10<small> L</small></div><div class="bar"><i></i></div></div>
</div>
<div class="row" style="margin-top:12px">
  <div class="card"><div class="lab">Trip A</div><div class="val">397.4<small> km</small></div></div>
  <div class="card"><div class="lab">Odometer</div><div class="val">12,336</div></div>
</div>
<div class="btn">Send message</div>
<nav><b>Dashboard</b><span>Message</span><span>Logs</span><span>Settings</span></nav>
</body></html>
